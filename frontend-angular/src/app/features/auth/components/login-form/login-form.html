<div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl">

    <div class="flex flex-col items-center">
      <div class="flex h-16 w-16 items-center justify-center rounded-full bg-amber-100">
          🏺
      </div>

      <h1 class="mt-6 text-3xl font-bold text-stone-900">
          Welcome Back!
      </h1>

      <p class="mt-2 text-center text-sm text-stone-500">
          Sign in to continue exploring timeless treasures.
      </p>
  </div>

  <form class="mt-10 space-y-6">

      <div>
          <label
              htmlFor="email"
              class="mb-2 block text-sm font-medium text-stone-800"
          >
              Email
          </label>

          <input
              id="email"
              type="email"
              placeholder="Enter your email..."
              class="w-full rounded-lg border border-stone-300 px-4 py-3 outline-none transition"
          />
      </div>

      <div>
          <div class="mb-2 flex justify-between items-center">
              <label
                  htmlFor="password"
                  class="text-sm font-medium text-stone-800"
              >
                  Password
              </label>

              <a
                  href="#"
                  class="text-sm text-amber-700 hover:underline"
              >
                  Forgot password?
              </a>
          </div>

          <input
              id="password"
              type="password"
              placeholder="••••••••"
              class="w-full rounded-lg border border-stone-300 px-4 py-3 outline-none transition"
          />
      </div>

      <app-button text="Sign In" />
  </form>

  <div class="mt-8 border-t border-stone-200 pt-6 text-center text-sm text-stone-600">
      Don't have an account?
      <a
        routerLink="/register"
        class="font-semibold text-amber-700 hover:underline"
      >
        Sign up
      </a>
  </div>
</div>
