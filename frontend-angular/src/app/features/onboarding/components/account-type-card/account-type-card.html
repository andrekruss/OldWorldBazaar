<a
  [routerLink]="cardData().to"
  class="group block rounded-2xl border border-stone-200 bg-white p-5 transition-all duration-200 hover:-translate-y-1 hover:border-amber-400 hover:shadow-lg"
>
  <div class="flex items-center gap-4">
      <div class="text-4xl transition-transform duration-200 group-hover:scale-110">
          {{ cardData().icon }}
      </div>

      <div>
          <h2 class="font-semibold text-stone-900">
              {{ cardData().title }}
          </h2>

          <p class="mt-1 text-sm text-stone-600">
              {{ cardData().description }}
          </p>
      </div>
  </div>
</a>
