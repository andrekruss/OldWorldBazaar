services:
  postgres:
    image: postgres:16
    container_name: oldworldbazaar-db
    restart: always
    environment:
      POSTGRES_DB: oldworldbazaar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - oldworldbazaar_pgdata:/var/lib/postgresql/data

volumes:
  oldworldbazaar_pgdata: